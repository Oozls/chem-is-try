{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <h2>{% if post %}글 수정하기{% else %}새 글 작성{% endif %}</h2>
    
    <form action='/board/{{ "edit/"+post._id|string if post else "post" }}' method="POST" onsubmit="this.querySelector('button[type=submit]').disabled = true;">
        
        <div class="form-group">
            <label for="category">말머리</label>
            <select id="category" name="category" required>
                <option value="일반" {% if post and post.category == '일반' %}selected{% endif %}>일반</option>
                <option value="질문" {% if post and post.category == '질문' %}selected{% endif %}>질문</option>
                <option value="제보" {% if post and post.category == '제보' %}selected{% endif %}>제보</option>
                <option value="요청" {% if post and post.category == '요청' %}selected{% endif %}>요청</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required autocomplete="off" placeholder="제목을 입력하세요">
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" required 
                      style="width: 100%; min-height: 400px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-family: inherit;"
                      placeholder="내용을 자유롭게 작성해주세요.">{{ post.content if post else '' }}</textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <a href="{{ '/board' if not post else '/board/view/'+post._id|string }}" class="btn-secondary">취소</a>
            <button type="submit" class="btn-primary">{% if post %}수정 완료{% else %}등록하기{% endif %}</button>
        </div>
    </form>
</div>
{% endblock %}
